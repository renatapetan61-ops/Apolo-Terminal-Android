name: APOLO ARM64 rootfs

on:
  pull_request:
    paths:
      - "os/**"
      - ".github/workflows/rootfs-build.yml"
  workflow_dispatch:
    inputs:
      debian_suite:
        description: Debian suite
        required: true
        default: trixie
        type: choice
        options:
          - trixie

permissions:
  contents: read

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Debian ARM64 rootfs
        uses: docker/build-push-action@v6
        with:
          context: ./os
          platforms: linux/arm64
          build-args: |
            DEBIAN_SUITE=${{ inputs.debian_suite || 'trixie' }}
          outputs: type=local,dest=./out

      - name: Verify artifact metadata
        shell: bash
        run: |
          set -euo pipefail
          test -s out/rootfs.tar.gz
          test -s out/build-info.txt
          grep -q '^architecture=arm64$' out/build-info.txt
          grep -q '^node_lts=v' out/build-info.txt
          grep -q '^docker=' out/build-info.txt
          grep -q '^compose=' out/build-info.txt
          tar -tzf out/rootfs.tar.gz >/dev/null

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: apolo-debian-arm64-rootfs
          path: out/
          if-no-files-found: error
          retention-days: 14

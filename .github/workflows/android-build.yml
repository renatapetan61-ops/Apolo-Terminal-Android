name: APOLO Android app build

on:
  push:
    branches:
      - "feature/**"
    paths:
      - "app/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "app/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

concurrency:
  group: apolo-android-build-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
      - name: Install Node.js for local xterm.js assets
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apolo-terminal-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
